
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            margin: 0;
            padding: 30px 15px;
            color: #222;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1, h2 {
            text-align: center;
            color: #2457a7;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2457a7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #173d78;
        }

        .secundario {
            background: #555;
        }

        .excluir {
            background: #c0392b;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        #listaClientes {
            margin-top: 20px;
            padding: 0;
            list-style: none;
        }

        #listaClientes li {
            padding: 14px;
            margin-bottom: 8px;
            background: #f0f4fa;
            border-radius: 6px;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        #listaClientes li:hover {
            background: #dce8fa;
        }

        #resultadoJSON {
            margin-top: 20px;
            padding: 15px;
            background: #20252b;
            color: #a8f0b0;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cadastro de Clientes</h1>

        <form id="formCliente">
            <label for="id">Código do cliente (ID):</label>
            <input type="text" id="id" readonly
                   placeholder="Gerado automaticamente">

            <label for="nome">Nome:</label>
            <input type="text" id="nome"
                   placeholder="Digite o nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email"
                   placeholder="Digite o e-mail" required>

            <div class="botoes">
                <button type="submit">Incluir cliente</button>

                <button type="button" class="secundario"
                        onclick="cadastrar_clientes()">
                    Cadastrar vários
                </button>

                <button type="button" class="secundario"
                        onclick="limparFormulario()">
                    Limpar campos
                </button>
            </div>
        </form>

        <h2>Buscar cliente</h2>

        <label for="busca">Pesquisar por nome ou ID:</label>
        <input type="text" id="busca"
               placeholder="Digite o nome ou código"
               oninput="listar_clientes()">

        <div class="botoes">
            <button type="button" onclick="buscar_cliente()">
                Buscar
            </button>

            <button type="button" class="secundario"
                    onclick="salvar_cliente()">
                Salvar clientes.json
            </button>
        </div>

        <p id="mensagem" role="status"></p>

        <h2>Lista de Clientes</h2>
        <ul id="listaClientes"></ul>

        <h2>Dados em JSON</h2>
        <pre id="resultadoJSON">[]</pre>
    </div>

    <script>
        // Lista de clientes em memória.
        // O programa começa com a lista vazia.
        let clientes = [];
        let proximoId = 1;

        // Classe Cliente
        class Cliente {
            constructor(id, nome, email) {
                this.id = id;
                this.nome = nome;
                this.email = email;
            }

            // Converte o cliente para um objeto JSON.
            toJSON() {
                return {
                    id: this.id,
                    nome: this.nome,
                    email: this.email
                };
            }
        }

        // Inclui um novo cliente na lista.
        function incluir_cliente(nome, email) {
            nome = nome.trim();
            email = email.trim();

            if (!nome || !email) {
                mostrarMensagem(
                    "Preencha o nome e o e-mail."
                );
                return false;
            }

            const cliente = new Cliente(
                proximoId,
                nome,
                email
            );

            clientes.push(cliente);
            proximoId++;

            listar_clientes();
            mostrarMensagem("Cliente cadastrado com sucesso!");

            return true;
        }

        // Salva os clientes em um arquivo clientes.json.
        function salvar_cliente() {
            const dadosJSON = JSON.stringify(
                clientes,
                null,
                4
            );

            const arquivo = new Blob(
                [dadosJSON],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(arquivo);
            const link = document.createElement("a");

            link.href = url;
            link.download = "clientes.json";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

            mostrarMensagem(
                "Arquivo clientes.json gerado!"
            );

            atualizarJSON();
        }

        // Solicita os dados de vários clientes.
        function cadastrar_clientes() {
            const quantidade = Number(
                prompt("Quantos clientes deseja cadastrar?")
            );

            if (
                !Number.isInteger(quantidade) ||
                quantidade < 1
            ) {
                mostrarMensagem("Quantidade inválida.");
                return;
            }

            for (let i = 0; i < quantidade; i++) {
                const nome = prompt(
                    "Nome do cliente " + (i + 1) + ":"
                );

                if (nome === null) break;

                const email = prompt(
                    "E-mail do cliente " + (i + 1) + ":"
                );

                if (email === null) break;

                incluir_cliente(nome, email);
            }

            listar_clientes();
        }

        // Exibe todos os clientes ou filtra pela pesquisa.
        function listar_clientes() {
            const lista = document.getElementById(
                "listaClientes"
            );

            const pesquisa = document.getElementById(
                "busca"
            ).value.trim().toLowerCase();

            lista.replaceChildren();

            const filtrados = clientes.filter(cliente =>
                cliente.nome.toLowerCase().includes(pesquisa) ||
                String(cliente.id).includes(pesquisa)
            );

            filtrados.forEach(cliente => {
                const item = document.createElement("li");

                item.textContent =
                    "ID: " + cliente.id +
                    " | Nome: " + cliente.nome +
                    " | E-mail: " + cliente.email;

                // Selecionar um cliente preenche o formulário.
                item.addEventListener("click", () => {
                    document.getElementById("id").value =
                        cliente.id;

                    document.getElementById("nome").value =
                        cliente.nome;

                    document.getElementById("email").value =
                        cliente.email;

                    mostrarMensagem(
                        "Cliente selecionado para consulta."
                    );
                });

                lista.appendChild(item);
            });

            if (filtrados.length === 0) {
                const item = document.createElement("li");
                item.textContent = "Nenhum cliente encontrado.";
                lista.appendChild(item);
            }

            atualizarJSON();
        }

        // Busca um cliente pelo nome ou pelo ID.
        function buscar_cliente() {
            const pesquisa = document.getElementById(
                "busca"
            ).value.trim().toLowerCase();

            if (!pesquisa) {
                mostrarMensagem(
                    "Digite um nome ou ID para pesquisar."
                );
                return;
            }

            const cliente = clientes.find(cliente =>
                String(cliente.id) === pesquisa ||
                cliente.nome.toLowerCase().includes(pesquisa)
            );

            if (cliente) {
                document.getElementById("id").value =
                    cliente.id;

                document.getElementById("nome").value =
                    cliente.nome;

                document.getElementById("email").value =
                    cliente.email;

                mostrarMensagem("Cliente encontrado!");
            } else {
                mostrarMensagem("Cliente não encontrado.");
            }

            listar_clientes();
        }

        // Atualiza a visualização dos dados JSON.
        function atualizarJSON() {
            document.getElementById(
                "resultadoJSON"
            ).textContent = JSON.stringify(
                clientes,
                null,
                4
            );
        }

        // Limpa os campos do formulário.
        function limparFormulario() {
            document.getElementById("formCliente").reset();
            document.getElementById("id").value = "";
            mostrarMensagem("Campos limpos.");
        }

        // Exibe mensagens para o usuário.
        function mostrarMensagem(texto) {
            document.getElementById(
                "mensagem"
            ).textContent = texto;
        }

        // Cadastra um cliente pelo formulário.
        document.getElementById(
            "formCliente"
        ).addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById(
                "nome"
            ).value;

            const email = document.getElementById(
                "email"
            ).value;

            if (incluir_cliente(nome, email)) {
                limparFormulario();
            }
        });

        // Inicialização: lista e visualização começam vazias.
        // Não é possível apagar um arquivo local existente
        // automaticamente apenas com JavaScript no navegador.
        clientes = [];
        proximoId = 1;

        listar_clientes();
    </script>
</body>
</html>
